<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order received | MasterChefHub</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f4;--ink:#0a0a0a;--muted:#737373;--line:#e4e4e1}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:20px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:36px 30px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.07);animation:in .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.logo{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:10px;background:#0a0a0a;margin-bottom:20px}
.logo img{width:32px;height:32px}
.ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:#0a0a0a;color:#fff}
.ic.bad{background:#e5484d}.ic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:2.1rem;letter-spacing:-.02em;line-height:1.1;margin-bottom:8px}
p{color:var(--muted);font-size:.95rem;line-height:1.6;margin-bottom:20px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border-radius:8px;border:0;background:var(--ink);color:#fff;font:700 .95rem 'Inter',sans-serif;cursor:pointer;text-decoration:none;transition:transform .2s,background .2s}
.btn:hover{background:#262626;transform:translateY(-2px)}
.btn.line{background:#fff;color:var(--ink);border:1.5px solid var(--line);margin-top:10px}
.btn[disabled]{opacity:.6;pointer-events:none}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid #e4e4e1;border-top-color:#0a0a0a;animation:sp .8s linear infinite;margin:6px auto 18px}
@keyframes sp{to{transform:rotate(360deg)}}
.fld{text-align:left;margin-bottom:12px}
.fld label{display:block;font-size:.82rem;font-weight:700;margin-bottom:6px}
.fld input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit;font-size:.95rem;outline:0;transition:.2s}
.fld input:focus{border-color:#0a0a0a;box-shadow:0 0 0 4px rgba(0,0,0,.06)}
.em{display:inline-block;background:#f0f0ed;border-radius:8px;padding:4px 12px;margin:2px 0;word-break:break-all}
.err{color:#9f1c20;font-size:.84rem;font-weight:600;margin:0 0 12px;text-align:left}
</style>
</head>
<body>
<main class="card" id="card"><div class="spin" aria-label="Loading"></div><h1>One moment</h1><p>Checking your payment...</p></main>
<script>
/* After the customer taps "I have paid" on the Venmo page, they land here.
   This is a courtesy gate, not proof of payment: the real check is the owner seeing the Venmo payment. */
(function () {
  var ok = false, started = 0;
  try { started = +localStorage.getItem('mch_pay_claim') || 0; } catch (e) {}
  if (started && Date.now() - started < 3 * 60 * 60 * 1000) ok = true;
  if (!ok) { location.replace('/?unpaid=1'); return; }
  try { localStorage.removeItem('mch_pay_claim'); localStorage.removeItem('mch_cart2'); } catch (e) {}
  var card = document.getElementById('card');
  card.innerHTML =
    '<a class="logo" href="/"><img src="/favicon.svg" alt="MasterChefHub"></a>' +
    '<div class="ic"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>' +
    '<h1>Thank you, order received</h1>' +
    '<p>We are checking for your Venmo payment. As soon as we see it, your order goes into the kitchen and we bring it to your door.</p>' +
    '<a class="btn" href="/profile">View my orders</a>' +
    '<a class="btn line" href="/food">Order something else</a>';
  document.title = 'Thank you | MasterChefHub';
})();
</script>
</body>
</html>
