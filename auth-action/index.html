<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account action | MasterChefHub</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f4;--ink:#0a0a0a;--muted:#737373;--line:#e4e4e1}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:20px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:36px 30px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.07);animation:in .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.logo{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:16px;background:#0a0a0a;margin-bottom:20px}
.logo img{width:32px;height:32px}
.ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:#0a0a0a;color:#fff}
.ic.bad{background:#e5484d}.ic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:2.1rem;letter-spacing:-.02em;line-height:1.1;margin-bottom:8px}
p{color:var(--muted);font-size:.95rem;line-height:1.6;margin-bottom:20px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border-radius:99px;border:0;background:var(--ink);color:#fff;font:700 .95rem 'Inter',sans-serif;cursor:pointer;text-decoration:none;transition:transform .2s,background .2s}
.btn:hover{background:#262626;transform:translateY(-2px)}
.btn.line{background:#fff;color:var(--ink);border:1.5px solid var(--line);margin-top:10px}
.btn[disabled]{opacity:.6;pointer-events:none}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid #e4e4e1;border-top-color:#0a0a0a;animation:sp .8s linear infinite;margin:6px auto 18px}
@keyframes sp{to{transform:rotate(360deg)}}
.fld{text-align:left;margin-bottom:12px}
.fld label{display:block;font-size:.82rem;font-weight:700;margin-bottom:6px}
.fld input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit;font-size:.95rem;outline:0;transition:.2s}
.fld input:focus{border-color:#0a0a0a;box-shadow:0 0 0 4px rgba(0,0,0,.06)}
.em{display:inline-block;background:#f0f0ed;border-radius:99px;padding:4px 12px;margin:2px 0;word-break:break-all}
.err{color:#9f1c20;font-size:.84rem;font-weight:600;margin:0 0 12px;text-align:left}
</style>
</head>
<body>
<main class="card" id="card"><div class="spin" aria-label="Loading"></div><h1>One moment</h1><p>Checking your link...</p></main>
<script type="module">
import * as D from '/data.js';
const card = document.getElementById('card');
const P = new URLSearchParams(location.search);
const mode = P.get('mode'), code = P.get('oobCode');
const OK = '<div class="ic"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>';
const BAD = '<div class="ic bad"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></div>';
const home = () => { let u = P.get('continueUrl') || ''; try { const x = new URL(u, location.origin); if (x.origin === location.origin) return x.pathname + x.search; } catch (e) {} return '/profile'; };
const show = h => { card.innerHTML = h; };
const msg = e => ({
  'auth/expired-action-code': 'This link has expired. Ask for a new one from your profile.',
  'auth/invalid-action-code': 'This link was already used or is not valid. If you already verified, just log in.',
  'auth/user-disabled': 'This account has been disabled.',
  'auth/user-not-found': 'We could not find this account.',
  'auth/weak-password': 'Use at least 6 characters for your password.',
  'auth/network-request-failed': 'No connection. Check your internet and try again.'
}[(e && e.code) || ''] || 'Something went wrong. Please try again.');
const fail = e => show(BAD + '<h1>That did not work</h1><p>' + msg(e) + '</p><a class="btn" href="/profile">Go to my profile</a><a class="btn line" href="/login">Log in</a>');

const c = await D.init();
if (!c) show(BAD + '<h1>Not available</h1><p>The site could not connect. Please try again in a moment.</p><a class="btn" href="/">Back to home</a>');
else if (!code) show(BAD + '<h1>Link not valid</h1><p>This page needs the link from your email. Open the link in the email again.</p><a class="btn" href="/">Back to home</a>');
else if (mode === 'verifyEmail' || mode === 'recoverEmail') {
  try {
    let who = ''; try { const info = await c.A.checkActionCode(c.auth, code); who = (info && info.data && (info.data.email || info.data.previousEmail)) || ''; } catch (e0) {}
    await c.A.applyActionCode(c.auth, code);
    if (!who) { try { who = (c.auth.currentUser && c.auth.currentUser.email) || ''; } catch (e1) {} }
    try { const u = c.auth.currentUser; if (u) { await u.reload(); await u.getIdToken(true); D.cacheUser(u); } } catch (e) {}
    show(OK + '<h1>' + (mode === 'verifyEmail' ? 'Email verified' : 'Email restored') + '</h1><p>' + (mode === 'verifyEmail' ? 'Thank you. ' + (who ? '<b class="em">' + D.esc(who) + '</b> is now verified.' : 'Your email address is now verified.') : 'Your email address was changed back' + (who ? ' to <b class="em">' + D.esc(who) + '</b>.' : '.')) + '</p><a class="btn" href="' + home() + '">Continue</a>');
  } catch (e) { fail(e); }
} else if (mode === 'resetPassword') {
  try {
    const email = await c.A.verifyPasswordResetCode(c.auth, code);
    show('<div class="logo"><img src="/favicon.svg" alt=""></div><h1>New password</h1><p>Choose a new password for ' + D.esc(email) + '.</p><form id="f" novalidate><div class="fld"><label for="p1">New password</label><input id="p1" type="password" autocomplete="new-password" minlength="6"></div><div class="fld"><label for="p2">Repeat password</label><input id="p2" type="password" autocomplete="new-password"></div><div class="err" id="er" hidden></div><button class="btn" id="go" type="submit">Save password</button></form>');
    document.getElementById('f').addEventListener('submit', async ev => {
      ev.preventDefault();
      const a = document.getElementById('p1').value, b = document.getElementById('p2').value, er = document.getElementById('er');
      er.hidden = true;
      if (a.length < 6) { er.hidden = false; er.textContent = 'Use at least 6 characters.'; return; }
      if (a !== b) { er.hidden = false; er.textContent = 'The passwords do not match.'; return; }
      const go = document.getElementById('go'); go.disabled = true;
      try { await c.A.confirmPasswordReset(c.auth, code, a); show(OK + '<h1>Password updated</h1><p>You can now log in with your new password.</p><a class="btn" href="/login">Log in</a>'); }
      catch (e) { go.disabled = false; er.hidden = false; er.textContent = msg(e); }
    });
  } catch (e) { fail(e); }
} else show(BAD + '<h1>Link not valid</h1><p>We do not recognize this link.</p><a class="btn" href="/">Back to home</a>');
</script>
</body>
</html>
