<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio | MasterChefHub</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--p:#141414;--p2:#1c1c1c;--ln:#333;--fg:#fff;--mu:#8d8d8d;--hd:56px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,select,textarea{font:inherit;font-size:16px;color:#fff;background:#000;border:1.5px solid var(--ln);padding:9px 10px;width:100%;border-radius:0}
input:focus,select:focus,textarea:focus{outline:2px solid #fff;outline-offset:1px}
input[type=range]{padding:0;border:0;background:none;height:26px;accent-color:#fff}
input[type=checkbox]{width:auto}
#gate{position:fixed;inset:0;z-index:50;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
#gate h1{font-size:.8rem;letter-spacing:.34em;font-weight:800}#gate p{color:var(--mu);font-size:.9rem}
.dots{display:flex;gap:14px}.dots i{width:16px;height:16px;border:2px solid #fff}.dots i.on{background:#fff}
.dots.bad{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:10px}
.pad button{height:62px;border:2px solid #fff;font-weight:800;font-size:1.3rem}.pad button:active{background:#fff;color:#000}
body.locked #app{display:none}
/* ---- app shell ---- */
#app{display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;gap:8px;padding:0 14px;height:var(--hd);border-bottom:2px solid #fff;background:#0a0a0a;z-index:8;flex:none}
header h1{font-size:.8rem;letter-spacing:.3em;font-weight:800;margin-right:auto;white-space:nowrap;display:flex;align-items:baseline;gap:10px}
header h1 small{color:var(--mu);letter-spacing:.1em;font-weight:600;font-size:.62rem}
.b{border:2px solid #fff;padding:9px 14px;font-weight:800;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.b:active{transform:translate(2px,2px)}.b.f{background:#fff;color:#000}.b.s{padding:6px 10px;font-size:.64rem;border-width:1.5px}.b.d{border-color:#ff4d4d;color:#ff4d4d}.b.on{background:#fff;color:#000}.b[disabled]{opacity:.4}
.main{display:grid;grid-template-columns:350px minmax(0,1fr) 320px;height:calc(100vh - var(--hd));min-height:0}
.panel{min-width:0;overflow:auto;-webkit-overflow-scrolling:touch}
.left{border-right:2px solid #fff;padding:12px;display:flex;flex-direction:column}
.right{border-left:2px solid #fff;padding:12px}
.center{min-width:0;overflow:auto;padding:12px 14px 18px;display:flex;flex-direction:column;gap:10px}
.stagewrap{flex:none}
.stage{background:#000;border:2px solid #fff;aspect-ratio:16/9;width:min(100%,calc((100vh - var(--hd) - 340px) * 16 / 9));min-width:300px;margin:0 auto;position:relative}
.stage canvas{width:100%;height:100%;display:block}
.tr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.tr .t{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;min-width:116px}
.tr .sp{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tr label{font-size:.66rem;color:var(--mu);display:flex;align-items:center;gap:6px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.tr input[type=range]{width:90px}
.tl{display:grid;grid-template-columns:46px minmax(0,1fr);border:2px solid #fff;background:var(--p);flex:none}
.tll div{height:46px;border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:.64rem;letter-spacing:.1em;font-weight:800;color:var(--mu)}
.tll div:first-child{height:26px}
.tls{overflow-x:auto;overflow-y:hidden;position:relative;-webkit-overflow-scrolling:touch}
.tli{position:relative}
.ruler{height:26px;border-bottom:1px solid var(--ln);position:relative;cursor:pointer;touch-action:pan-x}
.ruler span{position:absolute;top:0;height:100%;border-left:1px solid #444;font-size:.6rem;color:var(--mu);padding:3px 0 0 4px;pointer-events:none}
.row{height:46px;border-bottom:1px solid var(--ln);position:relative}
.it{position:absolute;top:4px;height:38px;border:2px solid #fff;font-size:.68rem;font-weight:700;padding:0 14px 0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.it.v{background:#fff;color:#000}.it.o{background:#000;color:#fff;border-style:dashed}.it.a{background:repeating-linear-gradient(135deg,#222 0 6px,#2e2e2e 6px 12px);color:#fff}
.it.lk{cursor:not-allowed;opacity:.75}.it.mu{opacity:.45}
.it.sel{outline:3px solid #ff6a1a;outline-offset:1px;z-index:2}
.it .rh{position:absolute;right:0;top:0;bottom:0;width:14px;cursor:ew-resize;background:rgba(128,128,128,.55)}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#ff3d3d;z-index:4;pointer-events:none}
.ph:before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top-color:#ff3d3d}
h3.hd{font-size:.68rem;letter-spacing:.22em;font-weight:800;margin:0 0 10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
h3.hd small{color:var(--mu);letter-spacing:.1em;font-weight:700;font-size:.6rem}
.sec{border-top:1px solid var(--ln);padding-top:12px;margin-top:12px}.sec:first-of-type{border:0;padding:0;margin:0}
.sec>h4{font-size:.6rem;letter-spacing:.2em;color:var(--mu);font-weight:800;margin-bottom:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fl{margin-bottom:8px}.fl label{display:flex;justify-content:space-between;font-size:.62rem;color:var(--mu);letter-spacing:.1em;font-weight:700;margin-bottom:4px;text-transform:uppercase}.fl label .val{color:#fff}
.hint{color:var(--mu);font-size:.82rem;line-height:1.55}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.sw button{height:34px;border:2px solid #444;position:relative;overflow:hidden}.sw button i{position:absolute;inset:0}.sw button.on{border-color:#fff;outline:2px solid #fff;outline-offset:1px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.acts .b{width:100%}
.lay{display:flex;align-items:center;gap:6px;border:1.5px solid #444;padding:6px 8px;margin-bottom:6px;font-size:.74rem;font-weight:700}
.lay span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}.lay small{color:var(--mu);font-size:.6rem;font-variant-numeric:tabular-nums}
.tabs{display:flex;border:2px solid #fff;margin-bottom:10px;flex:none}.tabs button{flex:1;padding:10px 4px;font-weight:800;font-size:.68rem;letter-spacing:.12em}.tabs button.on{background:#fff;color:#000}.tabs #tE{display:none}
.sbox{position:relative;margin-bottom:8px;flex:none}.sbox input{padding-right:70px}.sbox button{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:.6rem;letter-spacing:.1em;font-weight:800;color:var(--mu);padding:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px;flex:none}.chips button{border:1.5px solid #fff;padding:6px 9px;font-size:.62rem;font-weight:700;letter-spacing:.08em}.chips button.on{background:#fff;color:#000}
.cnt{font-size:.62rem;color:var(--mu);letter-spacing:.12em;font-weight:700;margin:2px 0 8px;display:flex;justify-content:space-between;align-items:center;flex:none}
#lib{min-height:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cd{border:1.5px solid #fff;background:#000;text-align:left;display:block;width:100%;position:relative}
.cd canvas{width:100%;aspect-ratio:16/9;display:block;background:#1a1a1a}
.cd .n{padding:7px 8px 3px;font-size:.7rem;font-weight:700;line-height:1.25;min-height:36px}
.cd .m{padding:0 8px 8px;display:flex;justify-content:space-between;font-size:.58rem;color:var(--mu);letter-spacing:.1em;font-weight:700}.cd .m b{color:#19d38a}
.cd .plus{position:absolute;top:6px;right:6px;width:26px;height:26px;background:#fff;color:#000;font-weight:800;display:grid;place-items:center;opacity:0;transition:opacity .15s}.cd:hover .plus{opacity:1}
.sn{display:flex;align-items:center;gap:8px;border:1.5px solid #fff;padding:8px;margin-bottom:8px}
.sn div{flex:1;min-width:0;font-size:.78rem;font-weight:700}.sn small{display:block;color:var(--mu);font-size:.6rem;letter-spacing:.08em;margin-top:2px}
#ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:20px}
#ov.on{display:flex}#ov .bx{border:2px solid #fff;background:#0a0a0a;padding:22px;max-width:460px;width:100%;text-align:center}
.bar{height:8px;background:#222;margin:14px 0}.bar i{display:block;height:100%;width:0;background:#fff}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:#fff;color:#000;font-weight:800;font-size:.72rem;letter-spacing:.1em;padding:11px 16px;opacity:0;transition:all .2s;z-index:70;pointer-events:none;text-transform:uppercase}#toast.on{opacity:1;transform:translateX(-50%)}
/* ---- phones and small screens ---- */
@media(max-width:1000px){
  header{padding:0 10px}header h1 small{display:none}header .b.s.hide-m{display:none}
  .main{display:flex;flex-direction:column;height:auto}
  .center{display:contents}
  .stagewrap{order:0;position:sticky;top:0;z-index:7;background:#0a0a0a;padding:8px 12px 6px;border-bottom:2px solid #fff}
  .stage{width:100%;min-width:0}
  .tr{margin-top:8px}.tr .sp{margin-left:0}
  .tl{order:1;margin:10px 12px 0}
  .left{order:2;border-right:0;overflow:visible;padding-top:12px}
  .right{order:3;border-left:0;overflow:visible;display:none}
  .tabs #tE{display:block}
  body.m-edit .right{display:block;border-top:0}
  body.m-edit #lib,body.m-edit .libtools{display:none}
}
</style>

<script>
/* ===== lock ===== */
(function(){
  var CODE='3424',val='',dots=document.querySelectorAll('#dots i'),pad=document.getElementById('pad');
  function unlocked(){try{return sessionStorage.getItem('mch_secret')==='1'}catch(e){return false}}
  function open(){document.body.classList.remove('locked');document.getElementById('gate').style.display='none';try{sessionStorage.setItem('mch_secret','1')}catch(e){}window.__studioStart&&window.__studioStart()}
  function paint(){dots.forEach(function(d,i){d.classList.toggle('on',i<val.length)})}
  function press(k){
    if(k==='<'){val=val.slice(0,-1);paint();return}
    if(val.length>=4)return;val+=k;paint();
    if(val.length===4){
      if(val===CODE)setTimeout(open,150);
      else{var D=document.getElementById('dots');D.classList.add('bad');setTimeout(function(){D.classList.remove('bad');val='';paint()},450)}
    }
  }
  '123456789 0<'.split('').forEach(function(k){var b=document.createElement('button');if(k===' '){b.style.visibility='hidden'}else{b.textContent=k==='<'?'DEL':k;b.addEventListener('click',function(){press(k)})}pad.appendChild(b)});
  document.addEventListener('keydown',function(e){if(!document.body.classList.contains('locked'))return;if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('<')});
  if(unlocked())open();
})();
</script>
<script>
(function(){
var W=1280,H=720;
var PAL=[{n:'Classic',bg:'#0a0a0a',fg:'#ffffff',acc:'#ffffff'},{n:'Paper',bg:'#f2f1ec',fg:'#0a0a0a',acc:'#0a0a0a'},{n:'Ruby',bg:'#0a0a0a',fg:'#ffffff',acc:'#ff2d3d'},{n:'Gold',bg:'#100d05',fg:'#f6e7b4',acc:'#d9a521'},{n:'Flame',bg:'#160800',fg:'#ffffff',acc:'#ff6a1a'},{n:'Mint',bg:'#04120d',fg:'#e8fff6',acc:'#19d38a'},{n:'Ocean',bg:'#050d1c',fg:'#eaf2ff',acc:'#2d7bff'},{n:'Rose',bg:'#160610',fg:'#fff0f6',acc:'#ff3d8b'}];
var cl=function(x,a,b){a=a==null?0:a;b=b==null?1:b;return Math.max(a,Math.min(b,x))};
var seg=function(t,a,b){return cl((t-a)/(b-a))};
var eo=function(t){return 1-Math.pow(1-t,3)},eio=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
var eb=function(t){var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
var FS=function(s,w){return (w||800)+' '+s+'px Inter,Helvetica,Arial,sans-serif'};
var SERIF=function(s){return '400 '+s+'px "Instrument Serif",Georgia,serif'};
var MONO=function(s){return '700 '+s+'px "Courier New",monospace'};
function rnd(seed){var s=(seed|0)||1;return function(){s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000}}
function fit(c,txt,maxW,size,fn){fn=fn||FS;c.font=fn(size);var w=c.measureText(txt).width;return w>maxW?Math.max(10,Math.floor(size*maxW/w)):size}
function bg(c,o){c.fillStyle=o.pal.bg;c.fillRect(0,0,W,H)}
function hat(c,cx,cy,s,fill,cut){
  c.fillStyle=fill;[[-.3,-.42,.3],[0,-.56,.36],[.3,-.42,.3]].forEach(function(p){c.beginPath();c.arc(cx+p[0]*s,cy+p[1]*s,p[2]*s,0,7);c.fill()});
  c.fillRect(cx-.42*s,cy-.32*s,.84*s,.52*s);c.fillRect(cx-.42*s,cy+.25*s,.84*s,.2*s);
  c.fillStyle=cut;c.fillRect(cx-.15*s,cy-.2*s,.045*s,.3*s);c.fillRect(cx+.11*s,cy-.2*s,.045*s,.3*s);c.fillRect(cx-.42*s,cy+.2*s,.84*s,.05*s);
}
function grid(c,t,o,a){c.save();c.strokeStyle=o.pal.fg;c.globalAlpha=a;c.lineWidth=1;var g=64,off=(t*14)%g;c.beginPath();for(var x=-off;x<W;x+=g){c.moveTo(x,0);c.lineTo(x,H)}for(var y=0;y<H;y+=g){c.moveTo(0,y);c.lineTo(W,y)}c.stroke();c.restore()}
function center(c,txt,size,y,font,col){c.font=(font||FS)(size);c.textAlign='center';c.textBaseline='middle';c.fillStyle=col;c.fillText(txt,W/2,y)}
function subline(c,o,y,a){if(!o.sub)return;c.save();c.globalAlpha*=a;center(c,o.sub.toUpperCase(),Math.min(34,fit(c,o.sub.toUpperCase(),1100,34,function(s){return FS(s,600)})),y,function(s){return FS(s,600)},o.pal.fg);c.restore()}
function bigLines(c,o,y,size){var L=o.lines;var s=size;L.forEach(function(l){s=Math.min(s,fit(c,l,1120,size))});return {L:L,s:s,lh:s*1.08,y0:y-(L.length-1)*s*1.08/2}}
function btn(c,x,y,w,h,txt,fill,tc,size){c.fillStyle=fill;c.fillRect(x,y,w,h);c.fillStyle=tc;c.font=FS(size||30);c.textAlign='center';c.textBaseline='middle';c.fillText(txt,x+w/2,y+h/2+2)}
function bell(c,x,y,s,col,rot){c.save();c.translate(x,y);c.rotate(rot||0);c.fillStyle=col;c.beginPath();c.moveTo(-s,s*.5);c.quadraticCurveTo(-s,-s*.9,0,-s*.95);c.quadraticCurveTo(s,-s*.9,s,s*.5);c.lineTo(s*1.2,s*.7);c.lineTo(-s*1.2,s*.7);c.closePath();c.fill();c.beginPath();c.arc(0,s*.95,s*.28,0,7);c.fill();c.restore()}
function cursor(c,x,y,s,fill,st){c.save();c.translate(x,y);c.scale(s,s);c.beginPath();c.moveTo(0,0);c.lineTo(0,26);c.lineTo(7,20);c.lineTo(12,31);c.lineTo(17,29);c.lineTo(12,19);c.lineTo(21,19);c.closePath();c.fillStyle=fill;c.fill();c.lineWidth=2;c.strokeStyle=st;c.stroke();c.restore()}

/* ===== the 25 animation templates (x4 looks each = 100 clips) ===== */
var T=[];
function add(id,name,cat,over,dur,text,sub,names,sfx,thumb,draw){T.push({id:id,name:name,cat:cat,over:over,dur:dur,text:text,sub:sub,names:names,sfx:sfx,thumb:thumb,draw:draw})}
var WEL='WELCOME TO|MASTERCHEFHUB';

add('drop','Letter Drop','Intros',0,4,'MASTERCHEFHUB','welcome to the kitchen',['From top','From bottom','From left','Pop'],'hit',1.9,function(c,t,o){
  bg(c,o);grid(c,t,o,.06);var txt=o.text,s=fit(c,txt,1120,120);c.font=FS(s);c.textBaseline='middle';c.textAlign='left';
  var w=c.measureText(txt).width,x=(W-w)/2,y=H/2-20,n=txt.length;
  for(var i=0;i<n;i++){var ch=txt[i],cw=c.measureText(ch).width,d=seg(t,i*.045,i*.045+.7),e=eb(d),dx=0,dy=0,sc=1;
    if(o.v==0)dy=-(1-e)*520;else if(o.v==1)dy=(1-e)*520;else if(o.v==2)dx=-(1-e)*900;else sc=e;
    c.save();c.globalAlpha=cl(d*4);c.translate(x+cw/2+dx,y+dy);c.scale(sc,sc);c.fillStyle=o.pal.fg;c.textAlign='center';c.font=FS(s);c.fillText(ch,0,0);c.restore();x+=cw}
  var ub=seg(t,n*.045,n*.045+.5);c.fillStyle=o.pal.acc;c.fillRect((W-w)/2,y+s*.62,w*eo(ub),6);subline(c,o,y+s*.62+56,seg(t,n*.045+.2,n*.045+.7))});

add('bars','Bar Reveal','Intros',0,4,WEL,'the home food kitchen',['Rows left','Columns down','Rows right','Columns up'],'whoosh',2.2,function(c,t,o){
  bg(c,o);var B=bigLines(c,o,H/2-10,130);c.textBaseline='middle';c.textAlign='center';c.fillStyle=o.pal.fg;
  B.L.forEach(function(l,i){c.font=FS(B.s);c.fillText(l,W/2,B.y0+i*B.lh)});subline(c,o,B.y0+B.L.length*B.lh*.62+40,seg(t,1.3,1.8));
  var N=8,vert=o.v%2==1;c.fillStyle=o.pal.acc;
  for(var i=0;i<N;i++){var d=eio(seg(t,.2+i*.07,.2+i*.07+.6));

var S={items:[],sel:null,t:0,playing:false,pps:60,next:1,tab:'clips',cat:'All',scat:'All',q:'',sfx:true,exporting:false,stopAt:0};
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var cv=$('#cv'),cx=cv.getContext('2d');
var ACX=null,DEST=null,MASTER=null;
var isM=function(){return window.matchMedia('(max-width:1000px)').matches};
function audio(){if(!ACX){var A=window.AudioContext||window.webkitAudioContext;if(!A)return null;ACX=new A();mkNoise(ACX);DEST=ACX.createMediaStreamDestination()}if(ACX.state==='suspended')ACX.resume();return ACX}
function total(){var m=0;S.items.forEach(function(i){m=Math.max(m,i.start+i.dur)});return m}
function fmt(t){t=Math.max(0,t);var m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1)}
function toast(m){var e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},1400)}
function save(){try{localStorage.setItem('mch_studio',JSON.stringify({items:S.items,next:S.next}))}catch(e){}}
function valid(i){return i.kind==='snd'?SBY[i.ref]:CBY[i.ref]}
function load(){try{var d=JSON.parse(localStorage.getItem('mch_studio')||'null');if(d&&d.items){S.items=d.items.filter(valid);S.next=d.next||S.items.length+1}}catch(e){}}
function cl(x){return Math.max(0,Math.min(1,x))}
function get(id){return S.items.find(function(i){return i.id===id})}
function cur(){return get(S.sel)}

/* ===== drawing ===== */
function drawItem(c,it,t,w,h){
  var clip=CBY[it.ref];if(!clip)return;var sp=it.spd||1,local=(t-it.start)*sp+(it.off||0),rem=it.start+it.dur-t;
  var a=it.op==null?1:it.op;if(it.fade>0)a*=Math.min(1,(t-it.start)/it.fade,rem/it.fade);
  c.save();c.globalAlpha=cl(a);
  if(it.sc!=null&&it.sc!==1||it.dx||it.dy||it.rot||it.flip){c.translate(W/2+(it.dx||0),H/2+(it.dy||0));c.rotate((it.rot||0)*Math.PI/180);var s=it.sc==null?1:it.sc;c.scale(it.flip?-s:s,s);c.translate(-W/2,-H/2)}
  var o={text:(it.text||'').replace(/\|/g,' '),lines:(it.text||'').split('|'),sub:it.sub||'',pal:PAL[it.pal==null?clip.pal:it.pal],v:clip.v,rem:rem/sp,dur:it.dur*sp};
  try{clip.tpl.draw(c,local,o)}catch(e){}
  c.restore();
}
function render(){
  var w=cv.width,h=cv.height,t=S.t;cx.save();cx.setTransform(1,0,0,1,0,0);cx.fillStyle='#000';cx.fillRect(0,0,w,h);cx.scale(w/W,h/H);
  [0,1].forEach(function(tr){S.items.filter(function(i){return i.kind==='clip'&&i.track===tr&&t>=i.start&&t<i.start+i.dur}).sort(function(a,b){return a.start-b.start}).forEach(function(it){cx.save();cx.beginPath();cx.rect(0,0,W,H);cx.clip();drawItem(cx,it,t,W,H);cx.restore()})});
  cx.restore();
}
function drawThumb(cvs,clip,t){
  var c=cvs.getContext('2d');c.setTransform(1,0,0,1,0,0);c.fillStyle='#161616';c.fillRect(0,0,cvs.width,cvs.height);c.scale(cvs.width/W,cvs.height/H);
  if(clip.over){c.fillStyle='#2a2a2a';for(var y=0;y<H;y+=90)for(var x=0;x<W;x+=90)if(((x+y)/90)%2==0)c.fillRect(x,y,90,90)}
  c.save();c.beginPath();c.rect(0,0,W,H);c.clip();drawItem(c,{ref:clip.id,start:0,dur:clip.dur,off:0,text:clip.text,sub:clip.sub,pal:clip.pal,fade:0},t,W,H);c.restore();
}

/* ===== timeline ===== */
function pxs(t){return t*S.pps}
function drawTL(){
  var tot=Math.max(total()+12,30),wid=pxs(tot);$('#tli').style.width=wid+'px';
  var rl='',step=S.pps>=100?1:S.pps>=50?2:5;for(var s=0;s<=tot;s+=step)rl+='<span style="left:'+pxs(s)+'px">'+fmt(s).replace(/\.0$/,'')+'</span>';$('#ruler').innerHTML=rl;
  document.querySelectorAll('.row').forEach(function(r){r.innerHTML=''});
  S.items.forEach(function(it){
    var r=document.querySelector('.row[data-tr="'+it.track+'"]');if(!r)return;var d=document.createElement('div');
    var nm=(it.kind==='snd'?SBY[it.ref].name:CBY[it.ref].name)+(it.lock?'  [LOCKED]':'')+(it.mute?'  [MUTED]':'');
    d.className='it '+(it.kind==='snd'?'a':CBY[it.ref].over?'o':'v')+(S.sel===it.id?' sel':'')+(it.lock?' lk':'')+(it.mute?' mu':'');d.dataset.id=it.id;d.style.left=pxs(it.start)+'px';d.style.width=Math.max(18,pxs(it.dur))+'px';
    d.innerHTML=esc(nm)+(it.lock?'':'<div class="rh" data-rh="1"></div>');r.appendChild(d)});
  placePH();
}
function placePH(){$('#ph').style.left=pxs(S.t)+'px'}
function ui(){$('#time').textContent=fmt(S.t)+' / '+fmt(total());$('#bPlay').textContent=S.playing?'Pause':'Play';placePH()}
var drag=null;
function trackAt(y,kind){var rows=document.querySelectorAll('.row');for(var i=0;i<rows.length;i++){var b=rows[i].getBoundingClientRect();if(y>=b.top&&y<b.bottom){var tr=+rows[i].dataset.tr;if(kind==='snd'?tr>=2:tr<2)return tr}}return null}
function snap(v,id){var best=v,bd=.08;[0,S.t].concat(S.items.filter(function(i){return i.id!==id}).reduce(function(a,i){a.push(i.start,i.start+i.dur);return a},[])).forEach(function(p){if(Math.abs(p-v)<bd){bd=Math.abs(p-v);best=p}});return Math.max(0,Math.round(best*100)/100)}
$('#tli').addEventListener('pointerdown',function(e){
  var it=e.target.closest('.it');
  if(it){var o=get(+it.dataset.id);S.sel=o.id;drag=o.lock?null:{id:o.id,x:e.clientX,start:o.start,dur:o.dur,mode:e.target.dataset.rh?'rs':'mv',moved:false};if(drag)try{it.setPointerCapture(e.pointerId)}catch(x){}drawTL();insp();if(isM())setTab('edit');return}
  if(e.target.closest('.ruler')||e.target.closest('.row')){var r=$('#tli').getBoundingClientRect();S.t=Math.max(0,(e.clientX-r.left)/S.pps);drag={scrub:true};if(S.playing){pause();play()}render();ui();try{e.target.setPointerCapture(e.pointerId)}catch(x){}}
});
window.addEventListener('pointermove',function(e){
  if(!drag)return;
  if(drag.scrub){var r=$('#tli').getBoundingClientRect();S.t=Math.max(0,(e.clientX-r.left)/S.pps);render();ui();return}
  var it=get(drag.id);if(!it)return;var dx=(e.clientX-drag.x)/S.pps;if(Math.abs(e.clientX-drag.x)>3)drag.moved=true;if(!drag.moved)return;
  if(drag.mode==='rs'){if(it.kind==='clip')it.dur=Math.max(.3,Math.min(300,Math.round((drag.dur+dx)*100)/100))}
  else{it.start=snap(drag.start+dx,it.id);var tr=trackAt(e.clientY,it.kind);if(tr!=null)it.track=tr}
  drawTL();render();ui();
});
window.addEventListener('pointerup',function(){if(drag&&!drag.scrub){insp();save()}drag=null});
function autoscroll(){var sc=$('#tls'),x=pxs(S.t);if(x>sc.scrollLeft+sc.clientWidth-40||x<sc.scrollLeft)sc.scrollLeft=Math.max(0,x-60)}

/* ===== properties panel ===== */
function sl(id,label,min,max,step,val,unit){return'<div class="fl"><label>'+label+' <span class="val">'+(Math.round(val*100)/100)+(unit||'')+'</span></label><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'" data-u="'+(unit||'')+'"></div>'}
function insp(){
  var it=cur(),b=$('#insp');
  if(!it){
    var list=S.items.slice().sort(function(a,c){return a.start-c.start});
    b.innerHTML='<h3 class="hd">PROPERTIES</h3><p class="hint">Tap any clip or sound in the timeline to edit it here: change its text, colors, size, position, speed and timing, or delete it. Tap the timeline to move the red playhead.</p>'+
    '<div class="sec"><h4>EVERYTHING IN YOUR VIDEO ('+list.length+')</h4>'+(list.length?list.map(function(i){return'<div class="lay"><span data-sel="'+i.id+'" style="cursor:pointer">'+esc(i.kind==='snd'?SBY[i.ref].name:CBY[i.ref].name)+'</span><small>'+fmt(i.start)+'</small><button class="b s d" data-ldel="'+i.id+'">X</button></div>'}).join(''):'<p class="hint">Empty. Add clips from the library.</p>')+'</div>'+
    '<div class="sec"><h4>SHORTCUTS</h4><p class="hint">Space = play or pause<br>S = split at playhead<br>D = duplicate<br>Delete = remove selected<br>Left / Right = step 0.1s</p></div>';return}
  var snd=it.kind==='snd',nm=snd?SBY[it.ref].name:CBY[it.ref].name,c=snd?null:CBY[it.ref],h='<h3 class="hd">'+esc(nm.toUpperCase())+'<small>'+(snd?'SOUND':c.cat.toUpperCase())+'</small></h3>';
  if(snd){
    h+='<div class="sec"><h4>SOUND</h4>'+sl('iV','Volume',0,1.5,.05,it.vol==null?1:it.vol,'')+'<div class="fl"><label>Start (sec)</label><input id="iS" type="number" step="0.1" min="0" value="'+it.start.toFixed(2)+'"></div></div>'+
    '<div class="sec"><h4>ACTIONS</h4><div class="acts"><button class="b s" id="iPrev">Preview</button><button class="b s" id="iDup">Duplicate</button><button class="b s'+(it.mute?' on':'')+'" id="iMute">'+(it.mute?'Unmute':'Mute')+'</button><button class="b s'+(it.lock?' on':'')+'" id="iLock">'+(it.lock?'Unlock':'Lock')+'</button><button class="b s" id="iTrack">Other sound row</button><button class="b s d" id="iDel">Delete</button></div></div>';
  }else{
    var hasT=c.tpl.text!=='',hasS=c.tpl.sub!=='';
    if(hasT||hasS)h+='<div class="sec"><h4>TEXT</h4>'+(hasT?'<div class="fl"><label>Main text (| = new line)</label><input id="iT" value="'+esc(it.text)+'"></div>':'')+(hasS?'<div class="fl"><label>Small text</label><input id="iU" value="'+esc(it.sub)+'"></div>':'')+'</div>';
    h+='<div class="sec"><h4>TIMING</h4><div class="g2"><div class="fl"><label>Start (sec)</label><input id="iS" type="number" step="0.1" min="0" value="'+it.start.toFixed(2)+'"></div><div class="fl"><label>Length (sec)</label><input id="iD" type="number" step="0.1" min="0.3" value="'+it.dur.toFixed(2)+'"></div></div>'+sl('iSp','Speed',.25,3,.05,it.spd||1,'x')+
    '<div class="fl"><label>Fade in and out</label><select id="iF">'+[[0,'None'],[.3,'Short'],[.6,'Medium'],[1,'Long']].map(function(f){return'<option value="'+f[0]+'"'+(it.fade==f[0]?' selected':'')+'>'+f[1]+'</option>'}).join('')+'</select></div></div>';
    var cp=it.pal==null?c.pal:it.pal;
    h+='<div class="sec"><h4>COLORS</h4><div class="sw">'+PAL.map(function(p,i){return'<button data-pal="'+i+'" title="'+p.n+'" class="'+(cp==i?'on':'')+'"><i style="background:linear-gradient(135deg,'+p.bg+' 50%,'+p.acc+' 50%)"></i></button>'}).join('')+'</div></div>';
    h+='<div class="sec"><h4>LOOK AND POSITION</h4>'+sl('iOp','Opacity',0,1,.05,it.op==null?1:it.op,'')+sl('iSc','Size',.3,2.5,.05,it.sc==null?1:it.sc,'x')+sl('iX','Move left / right',-640,640,5,it.dx||0,'')+sl('iY','Move up / down',-360,360,5,it.dy||0,'')+sl('iR','Rotate',-180,180,1,it.rot||0,'deg')+
    '<div class="acts"><button class="b s'+(it.flip?' on':'')+'" id="iFlip">Flip sideways</button><button class="b s" id="iReset">Reset look</button></div></div>';
    h+='<div class="sec"><h4>ACTIONS</h4><div class="acts"><button class="b s" id="iPrev">Preview this clip</button><button class="b s" id="iSplit">Split at playhead</button><button class="b s" id="iDup">Duplicate</button><button class="b s" id="iTrack">'+(it.track===0?'Move to overlay':'Move to main')+'</button><button class="b s'+(it.lock?' on':'')+'" id="iLock">'+(it.lock?'Unlock':'Lock')+'</button><button class="b s" id="iRip">Delete and close gap</button><button class="b s d" id="iDel" style="grid-column:1/3">Delete</button></div></div>';
  }
  b.innerHTML=h;
}
$('#insp').addEventListener('input',function(e){
  var it=cur();if(!it)return;var id=e.target.id,v=e.target.value;
  if(id==='iT')it.text=v;else if(id==='iU')it.sub=v;else if(id==='iS')it.start=Math.max(0,+v||0);else if(id==='iD')it.dur=Math.max(.3,+v||1);else if(id==='iF')it.fade=+v;else if(id==='iV')it.vol=+v;
  else if(id==='iOp')it.op=+v;else if(id==='iSc')it.sc=+v;else if(id==='iX')it.dx=+v;else if(id==='iY')it.dy=+v;else if(id==='iR')it.rot=+v;else if(id==='iSp')it.spd=+v;else return;
  if(e.target.type==='range'){var vl=e.target.closest('.fl').querySelector('.val');if(vl)vl.textContent=(Math.round(+v*100)/100)+(e.target.dataset.u||'')}
  drawTL();render();ui();save();
});
function dup(it){var d=JSON.parse(JSON.stringify(it));d.id=S.next++;d.start=Math.round((it.start+it.dur)*100)/100;S.items.push(d);S.sel=d.id;return d}
function refresh(){drawTL();insp();render();ui();save()}
$('#insp').addEventListener('click',function(e){
  var t=e.target,sel=t.closest('[data-sel]');if(sel){S.sel=+sel.dataset.sel;drawTL();insp();return}
  var ld=t.closest('[data-ldel]');if(ld){S.items=S.items.filter(function(i){return i.id!==+ld.dataset.ldel});refresh();return}
  var pb=t.closest('[data-pal]');var it=cur();if(!it)return;
  if(pb){it.pal=+pb.dataset.pal;refresh();return}
  var id=t.id;
  if(id==='iDel'){S.items=S.items.filter(function(i){return i!==it});S.sel=null;refresh();toast('Deleted')}
  else if(id==='iRip'){S.items=S.items.filter(function(i){return i!==it});S.items.forEach(function(i){if(i.track===it.track&&i.start>=it.start+it.dur-.01)i.start=Math.max(0,Math.round((i.start-it.dur)*100)/100)});S.sel=null;refresh();toast('Deleted, gap closed')}
  else if(id==='iDup'){dup(it);refresh();toast('Duplicated')}
  else if(id==='iPrev'){if(it.kind==='snd')hearSound(it.ref,it.vol);else{pause();S.t=it.start;S.stopAt=it.start+it.dur;play()}}
  else if(id==='iSplit'){var at=S.t;if(it.kind==='clip'&&at>it.start+.2&&at<it.start+it.dur-.2){var d2=JSON.parse(JSON.stringify(it));d2.id=S.next++;d2.start=at;d2.off=(it.off||0)+(at-it.start)*(it.spd||1);d2.dur=it.start+it.dur-at;it.dur=at-it.start;S.items.push(d2);S.sel=d2.id;refresh();toast('Split')}else toast('Move the playhead inside the clip first')}
  else if(id==='iLock'){it.lock=!it.lock;refresh()}
  else if(id==='iMute'){it.mute=!it.mute;refresh()}
  else if(id==='iTrack'){it.track=it.kind==='snd'?(it.track===2?3:2):(it.track===0?1:0);refresh()}
  else if(id==='iFlip'){it.flip=!it.flip;refresh()}
  else if(id==='iReset'){it.op=1;it.sc=1;it.dx=0;it.dy=0;it.rot=0;it.flip=false;it.spd=1;refresh()}
});

/* ===== playback ===== */
var raf=0,t0=0;
function stopSounds(){if(MASTER){try{MASTER.gain.cancelScheduledValues(0);MASTER.gain.setValueAtTime(0,ACX.currentTime);var m=MASTER;setTimeout(function(){try{m.disconnect()}catch(e){}},50)}catch(e){}MASTER=null}}
function play(){
  if(!total())return;var x=audio();if(S.t>=total()-.05&&!S.stopAt)S.t=0;S.playing=true;t0=performance.now()-S.t*1000;
  if(x){MASTER=x.createGain();MASTER.gain.value=1;MASTER.connect(x.destination);MASTER.connect(DEST);var base=x.currentTime+.05;
    S.items.forEach(function(it){if(it.kind==='snd'&&!it.mute&&it.start>=S.t-.01&&(!S.stopAt||it.start<S.stopAt))try{SBY[it.ref].play(x,MASTER,base+(it.start-S.t),it.vol==null?1:it.vol)}catch(e){}})}
  cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);ui();
}
function pause(){S.playing=false;S.stopAt=0;cancelAnimationFrame(raf);stopSounds();ui()}
function tick(){
  if(!S.playing)return;S.t=(performance.now()-t0)/1000;var tot=total();
  if(S.stopAt&&S.t>=S.stopAt){S.t=S.stopAt;pause();render();ui();return}
  if(S.t>=tot+(S.exporting?.4:0)){S.t=tot;pause();render();ui();if(S.exporting)finishExport();return}
  render();ui();autoscroll();raf=requestAnimationFrame(tick);
}
function hearSound(id,vol){var x=audio();if(!x)return;var g=x.createGain();g.connect(x.destination);try{SBY[id].play(x,g,x.currentTime+.03,vol==null?1:vol)}catch(e){}}

/* ===== adding ===== */
function addClip(id){
  var c=CBY[id],it={id:S.next++,kind:'clip',ref:id,track:c.over?1:0,start:0,dur:c.dur,off:0,text:c.text,sub:c.sub,pal:c.pal,fade:0,op:1,sc:1,dx:0,dy:0,rot:0,spd:1};
  if(c.over)it.start=Math.round(S.t*10)/10;else{var e=0;S.items.forEach(function(i){if(i.track===0)e=Math.max(e,i.start+i.dur)});it.start=Math.round(e*100)/100}
  S.items.push(it);S.sel=it.id;
  if(S.sfx&&c.sfx&&SBY[c.sfx])addSnd(c.sfx,it.start,true);
  S.t=it.start+Math.min(c.tpl.thumb,it.dur*.9);drawTL();insp();render();ui();save();toast('Added to timeline');
  $('#tls').scrollLeft=Math.max(0,pxs(it.start)-40);
}
function addSnd(id,start,quiet){
  var s=SBY[id],row=2;if(start==null)start=Math.round(S.t*10)/10;
  if(S.items.some(function(i){return i.track===2&&i.kind==='snd'&&start<i.start+i.dur&&start+s.dur>i.start}))row=3;
  var it={id:S.next++,kind:'snd',ref:id,track:row,start:start,dur:s.dur,off:0,vol:1};S.items.push(it);
  if(!quiet){S.sel=it.id;drawTL();insp();render();ui();save();toast('Sound added at playhead')}
}

/* ===== library with search ===== */
var CATS=['All','Intros','Overlays','Backgrounds','Transitions','Outros'],SCATS=['All','Whooshes','Hits','Kitchen','Tones','Music'];
function tools(){
  var ph=S.tab==='clips'?'Search '+CLIPS.length+' clips (try: intro, glitch, subscribe)':'Search '+SND.length+' sounds (try: whoosh, beat, sizzle)',cats=S.tab==='clips'?CATS:SCATS,cc=S.tab==='clips'?S.cat:S.scat;
  var h='<div class="sbox"><input id="q" type="search" placeholder="'+esc(ph)+'" value="'+esc(S.q)+'" autocomplete="off"><button id="qx">'+(S.q?'CLEAR':'')+'</button></div>';
  h+='<div class="chips">'+cats.map(function(c){return'<button data-cat="'+c+'" class="'+(cc===c?'on':'')+'">'+c.toUpperCase()+'</button>'}).join('')+'</div>';
  h+='<div class="cnt"><span id="rc"></span>'+(S.tab==='clips'?'<label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="sfxc"'+(S.sfx?' checked':'')+'> MATCHING SOUND</label>':'')+'</div>';
  $('#libtools').innerHTML=h;
}
function lib(){tools();var l=$('#lib');l.innerHTML=S.tab==='clips'?'<div class="grid" id="cg"></div>':'<div id="sg"></div>';list()}
function list(){
  var q=S.q.trim().toLowerCase();
  if(S.tab==='clips'){
    var r=CLIPS.filter(function(c){return(S.cat==='All'||c.cat===S.cat)&&(!q||(c.name+' '+c.cat+' '+c.tpl.names.join(' ')).toLowerCase().indexOf(q)>=0)});
    $('#rc').textContent=r.length+' CLIPS - ALL FREE';
    var g=$('#cg');g.innerHTML=r.map(function(c){return'<button class="cd" data-add="'+c.id+'"><canvas width="320" height="180" data-th="'+c.id+'"></canvas><span class="plus">+</span><div class="n">'+esc(c.name)+'</div><div class="m"><span>'+c.cat.toUpperCase()+' - '+c.dur+'S</span><b>FREE</b></div></button>'}).join('')||'<p class="hint">No clips match. Try a shorter word.</p>';
    g.querySelectorAll('canvas').forEach(function(cvs){var c=CBY[cvs.dataset.th];drawThumb(cvs,c,c.thumb)});
  }else{
    var r2=SND.filter(function(s){return(S.scat==='All'||s.cat===S.scat)&&(!q||(s.name+' '+s.cat).toLowerCase().indexOf(q)>=0)});
    $('#rc').textContent=r2.length+' SOUNDS - ALL FREE';
    $('#sg').innerHTML=r2.map(function(s){return'<div class="sn"><button class="b s" data-hear="'+s.id+'">Play</button><div>'+esc(s.name)+'<small>'+s.cat.toUpperCase()+' - '+s.dur.toFixed(1)+' SEC</small></div><button class="b s f" data-sadd="'+s.id+'">Add</button></div>'}).join('')||'<p class="hint">No sounds match.</p>';
  }
}
var hov=null;
function stopHov(){if(hov){cancelAnimationFrame(hov.raf);drawThumb(hov.cn,hov.c,hov.c.thumb);hov=null}}
$('#lib').addEventListener('mouseover',function(e){var cvs=e.target.closest('.cd');if(!cvs||hov&&hov.el===cvs)return;stopHov();var c=CBY[cvs.dataset.add],cn=cvs.querySelector('canvas'),st=performance.now();hov={el:cvs,raf:0,c:c,cn:cn};(function f(){if(!hov||hov.el!==cvs)return;drawThumb(cn,c,((performance.now()-st)/1000)%c.dur);hov.raf=requestAnimationFrame(f)})()});
$('#lib').addEventListener('mouseout',function(e){var cvs=e.target.closest('.cd');if(cvs&&hov&&hov.el===cvs&&!cvs.contains(e.relatedTarget))stopHov()});
$('#lib').addEventListener('click',function(e){
  var a=e.target.closest('[data-add]');if(a){addClip(a.dataset.add);return}
  var hs=e.target.closest('[data-hear]');if(hs){hearSound(hs.dataset.hear);return}
  var sa=e.target.closest('[data-sadd]');if(sa)addSnd(sa.dataset.sadd);
});
$('#libtools').addEventListener('click',function(e){
  var ct=e.target.closest('[data-cat]');if(ct){if(S.tab==='clips')S.cat=ct.dataset.cat;else S.scat=ct.dataset.cat;tools();list();return}
  if(e.target.id==='qx'){S.q='';tools();list();$('#q').focus();return}
  if(e.target.id==='sfxc')S.sfx=e.target.checked;
});
$('#libtools').addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;$('#qx').textContent=S.q?'CLEAR':'';list()}});
function setTab(t){
  S.tab=t;['tC','tS','tE'].forEach(function(i){$('#'+i).classList.remove('on')});
  $(t==='clips'?'#tC':t==='snd'?'#tS':'#tE').classList.add('on');document.body.classList.toggle('m-edit',t==='edit');
  if(t!=='edit'){S.q='';stopHov();lib()}
  if(t==='edit')insp();
}
$('#tC').addEventListener('click',function(){setTab('clips')});$('#tS').addEventListener('click',function(){setTab('snd')});$('#tE').addEventListener('click',function(){setTab('edit')});

/* ===== buttons ===== */
$('#bPlay').addEventListener('click',function(){S.playing?pause():play()});
$('#bStop').addEventListener('click',function(){pause();S.t=0;render();ui();$('#tls').scrollLeft=0});
$('#zoom').addEventListener('input',function(e){S.pps=+e.target.value;drawTL()});
$('#bFit').addEventListener('click',function(){var tot=Math.max(total(),5),w=$('#tls').clientWidth-30;S.pps=Math.max(20,Math.min(160,w/tot));$('#zoom').value=S.pps;drawTL();$('#tls').scrollLeft=0});
$('#bNew').addEventListener('click',function(){if(S.items.length&&!confirm('Start a new empty project?'))return;pause();S.items=[];S.sel=null;S.t=0;refresh()});
$('#bSave').addEventListener('click',function(){var b=new Blob([JSON.stringify({v:2,items:S.items,next:S.next})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='masterchefhub-project.json';document.body.appendChild(a);a.click();a.remove()});
$('#bLoad').addEventListener('click',function(){$('#fLoad').click()});
$('#fLoad').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);S.items=d.items.filter(valid);S.next=d.next||S.items.length+1;S.sel=null;S.t=0;refresh()}catch(x){alert('That file is not a MasterChefHub project.')}};r.readAsText(f);e.target.value=''});
document.addEventListener('keydown',function(e){
  if(document.body.classList.contains('locked'))return;var tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;var it=cur();
  if(e.code==='Space'){e.preventDefault();S.playing?pause():play()}
  else if((e.key==='Delete'||e.key==='Backspace')&&it){S.items=S.items.filter(function(i){return i!==it});S.sel=null;refresh()}
  else if(e.key==='d'&&it){dup(it);refresh()}
  else if(e.key==='s'&&it&&it.kind==='clip'){var b=$('#iSplit');if(b)b.click()}
  else if(e.key==='ArrowLeft'){S.t=Math.max(0,S.t-.1);render();ui()}else if(e.key==='ArrowRight'){S.t+=.1;render();ui()}
});

/* ===== export a real video file ===== */
var rec=null,chunks=[],mime='';
function pickMime(){var l=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4;codecs=avc1,mp4a.40.2','video/mp4'];for(var i=0;i<l.length;i++){try{if(window.MediaRecorder&&MediaRecorder.isTypeSupported(l[i]))return l[i]}catch(e){}}return''}
function ov(html){$('#ovb').innerHTML=html;$('#ov').classList.add('on')}
function closeOv(){$('#ov').classList.remove('on')}
var HD='<h3 style="letter-spacing:.2em;font-size:.8rem;margin-bottom:10px">';
$('#bExp').addEventListener('click',function(){
  if(!total()){ov(HD+'NOTHING TO EXPORT</h3><p class="hint">Add a clip first.</p><div style="height:14px"></div><button class="b f" id="ovx">OK</button>');return}
  mime=pickMime();if(!mime||!cv.captureStream){ov(HD+'CANNOT RECORD HERE</h3><p class="hint">This browser cannot save video. Open this page in Chrome or Edge on a computer, or Safari on a recent iPhone.</p><div style="height:14px"></div><button class="b f" id="ovx">OK</button>');return}
  pause();var res=+$('#res').value;cv.width=res===1080?1920:1280;cv.height=res===1080?1080:720;
  var x=audio();S.t=0;render();chunks=[];
  var st=cv.captureStream(30);if(x&&DEST){var at=DEST.stream.getAudioTracks()[0];if(at)st.addTrack(at)}
  try{rec=new MediaRecorder(st,{mimeType:mime,videoBitsPerSecond:res===1080?9e6:5e6})}catch(e){rec=new MediaRecorder(st)}
  rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=function(){var type=(mime.split(';')[0])||'video/webm',blob=new Blob(chunks,{type:type}),url=URL.createObjectURL(blob),ext=/mp4/.test(type)?'mp4':'webm';
    cv.width=1280;cv.height=720;S.exporting=false;S.t=0;render();ui();
    ov(HD+'YOUR VIDEO IS READY</h3><video src="'+url+'" controls playsinline style="width:100%;background:#000;margin-bottom:12px"></video><a class="b f" style="display:flex;text-decoration:none" href="'+url+'" download="masterchefhub-video.'+ext+'">DOWNLOAD VIDEO (.'+ext.toUpperCase()+')</a><div style="height:10px"></div><button class="b" id="ovx">CLOSE</button>')};
  S.exporting=true;ov(HD+'RECORDING YOUR VIDEO</h3><p class="hint">It records in real time, so it takes as long as your video ('+fmt(total())+'). Keep this page open and on screen.</p><div class="bar"><i id="xb"></i></div><button class="b" id="ovc">CANCEL</button>');
  rec.start(250);play();
  var iv=setInterval(function(){var b=$('#xb');if(b)b.style.width=Math.min(100,S.t/total()*100)+'%';if(!S.exporting)clearInterval(iv)},200);
});
function finishExport(){setTimeout(function(){try{rec.stop()}catch(e){}},200)}
$('#ov').addEventListener('click',function(e){
  if(e.target.id==='ovx')closeOv();
  if(e.target.id==='ovc'){S.exporting=false;try{rec.onstop=null;rec.stop()}catch(x){}pause();cv.width=1280;cv.height=720;closeOv();render()}
});

/* ===== start ===== */
window.__studioStart=function(){
  if(window.__started)return;window.__started=true;
  $('#cnt').textContent=CLIPS.length+' CLIPS - '+SND.length+' SOUNDS - ALL FREE';
  load();lib();drawTL();insp();render();ui();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){list();render()});
};
if(!document.body.classList.contains('locked'))window.__studioStart();
window.__S=S;window.__addClip=addClip;window.__SBY=SBY;window.__mkNoise=mkNoise;window.__render=render;
})();
</script>
