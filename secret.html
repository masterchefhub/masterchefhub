<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio | MasterChefHub</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--p:#141414;--p2:#1c1c1c;--ln:#333;--fg:#fff;--mu:#8d8d8d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,select,textarea{font:inherit;font-size:16px;color:#fff;background:#000;border:1.5px solid var(--ln);padding:9px 10px;width:100%;border-radius:0}
input:focus,select:focus,textarea:focus{outline:2px solid #fff;outline-offset:1px}
/* gate */
#gate{position:fixed;inset:0;z-index:50;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
#gate h1{font-size:.8rem;letter-spacing:.34em;font-weight:800}
#gate p{color:var(--mu);font-size:.9rem}
.dots{display:flex;gap:14px}.dots i{width:16px;height:16px;border:2px solid #fff}.dots i.on{background:#fff}
.dots.bad{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:10px}
.pad button{height:62px;border:2px solid #fff;font-weight:800;font-size:1.3rem}.pad button:active{background:#fff;color:#000}
body.locked #app{display:none}
/* app */
#app{min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:2px solid #fff;position:sticky;top:0;background:#0a0a0a;z-index:5;flex-wrap:wrap}
header h1{font-size:.8rem;letter-spacing:.3em;font-weight:800;margin-right:auto;white-space:nowrap}
header h1 small{color:var(--mu);letter-spacing:.12em;font-weight:600;margin-left:8px}
.b{border:2px solid #fff;padding:9px 14px;font-weight:800;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.b:active{transform:translate(2px,2px)}.b.f{background:#fff;color:#000}.b.s{padding:6px 10px;font-size:.66rem;border-width:1.5px}.b[disabled]{opacity:.4}
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;flex:1;min-height:0}
.left{min-width:0;border-right:2px solid #fff;padding:12px 14px 40px}
.right{min-width:0;padding:12px 14px 40px;max-height:calc(100vh - 56px);overflow:auto;position:sticky;top:56px}
@media(max-width:900px){.main{grid-template-columns:1fr}.right{position:static;max-height:none;border-top:2px solid #fff}.left{border-right:0}}
.stage{background:#000;border:2px solid #fff;aspect-ratio:16/9;position:relative}
.stage canvas{width:100%;height:100%;display:block}
.tr{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.tr .t{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;min-width:118px}
.tr label{font-size:.7rem;color:var(--mu);display:flex;align-items:center;gap:6px;letter-spacing:.08em}
.tr input[type=range]{width:110px;padding:0;border:0;background:none}
.tl{display:grid;grid-template-columns:46px minmax(0,1fr);border:2px solid #fff;background:var(--p)}
.tll div{height:46px;border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:.64rem;letter-spacing:.1em;font-weight:800;color:var(--mu)}
.tll div:first-child{height:26px}
.tls{overflow-x:auto;overflow-y:hidden;position:relative;-webkit-overflow-scrolling:touch}
.tli{position:relative}
.ruler{height:26px;border-bottom:1px solid var(--ln);position:relative;cursor:pointer;touch-action:pan-x}
.ruler span{position:absolute;top:0;height:100%;border-left:1px solid #444;font-size:.6rem;color:var(--mu);padding:3px 0 0 4px}
.row{height:46px;border-bottom:1px solid var(--ln);position:relative}
.it{position:absolute;top:4px;height:38px;border:2px solid #fff;font-size:.68rem;font-weight:700;padding:0 14px 0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.it.v{background:#fff;color:#000}.it.o{background:#000;color:#fff;border-style:dashed}.it.a{background:repeating-linear-gradient(135deg,#222 0 6px,#2e2e2e 6px 12px);color:#fff}
.it.sel{outline:3px solid #ff6a1a;outline-offset:1px;z-index:2}
.it .rh{position:absolute;right:0;top:0;bottom:0;width:14px;cursor:ew-resize;background:rgba(128,128,128,.55)}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#ff3d3d;z-index:4;pointer-events:none}
.ph:before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top-color:#ff3d3d}
.insp{border:2px solid #fff;padding:12px;margin-top:12px}
.insp h3,.lib h3{font-size:.7rem;letter-spacing:.22em;font-weight:800;margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fl{margin-bottom:8px}.fl label{display:block;font-size:.64rem;color:var(--mu);letter-spacing:.1em;font-weight:700;margin-bottom:4px;text-transform:uppercase}
.hint{color:var(--mu);font-size:.82rem;line-height:1.55}
.tabs{display:flex;border:2px solid #fff;margin-bottom:10px}.tabs button{flex:1;padding:10px;font-weight:800;font-size:.7rem;letter-spacing:.14em}.tabs button.on{background:#fff;color:#000}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{border:1.5px solid #fff;padding:6px 10px;font-size:.66rem;font-weight:700;letter-spacing:.08em}.chips button.on{background:#fff;color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cd{border:1.5px solid #fff;background:#000;text-align:left;display:block;width:100%}
.cd canvas{width:100%;aspect-ratio:16/9;display:block;background:#1a1a1a}
.cd .n{padding:7px 8px 3px;font-size:.7rem;font-weight:700;line-height:1.25;min-height:36px}
.cd .m{padding:0 8px 8px;display:flex;justify-content:space-between;font-size:.6rem;color:var(--mu);letter-spacing:.1em;font-weight:700}
.cd .m b{color:#19d38a}
.sn{display:flex;align-items:center;gap:8px;border:1.5px solid #fff;padding:8px;margin-bottom:8px}
.sn div{flex:1;min-width:0;font-size:.78rem;font-weight:700}.sn small{display:block;color:var(--mu);font-size:.62rem;letter-spacing:.08em;margin-top:2px}
#ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:20px}
#ov.on{display:flex}#ov .bx{border:2px solid #fff;background:#0a0a0a;padding:22px;max-width:460px;width:100%;text-align:center}
.bar{height:8px;background:#222;margin:14px 0}.bar i{display:block;height:100%;width:0;background:#fff}
</style>
</head>
<body class="locked">
<div id="gate">
  <h1>MASTERCHEFHUB STUDIO</h1>
  <p>Enter the 4 digit code</p>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"></div>
</div>
<div id="app">
<header>
  <h1>STUDIO<small id="cnt"></small></h1>
  <button class="b s" id="bSave">Save project</button>
  <button class="b s" id="bLoad">Open project</button>
  <button class="b s" id="bNew">New</button>
  <button class="b f" id="bExp">Export video</button>

</header>
<div class="main">
  <section class="left">
    <div class="stage"><canvas id="cv" width="1280" height="720"></canvas></div>
    <div class="tr">
      <button class="b f" id="bPlay">Play</button>
      <button class="b" id="bStop">Start</button>
      <span class="t" id="time">0:00.0 / 0:00.0</span>
      <label>Zoom <input type="range" id="zoom" min="20" max="160" value="60"></label>
      <label>Quality <select id="res" style="width:auto;padding:5px 8px;font-size:.8rem"><option value="720">720p</option><option value="1080">1080p</option></select></label>
    </div>
    <div class="tl">
      <div class="tll"><div></div><div>V2</div><div>V1</div><div>A1</div><div>A2</div></div>
      <div class="tls" id="tls"><div class="tli" id="tli"><div class="ruler" id="ruler"></div><div class="row" data-tr="1"></div><div class="row" data-tr="0"></div><div class="row" data-tr="2"></div><div class="row" data-tr="3"></div><div class="ph" id="ph"></div></div></div>
    </div>
    <div class="insp" id="insp"></div>
  </section>
  <aside class="right">
    <div class="tabs"><button id="tC" class="on">CLIPS</button><button id="tS">SOUNDS</button></div>
    <div id="lib"></div>
  </aside>
</div>
</div>
<div id="ov"><div class="bx" id="ovb"></div></div>
<script>
/* ===== lock ===== */
(function(){
  var CODE='3424',val='',dots=document.querySelectorAll('#dots i'),pad=document.getElementById('pad');
  function unlocked(){try{return sessionStorage.getItem('mch_secret')==='1'}catch(e){return false}}
  function open(){document.body.classList.remove('locked');document.getElementById('gate').style.display='none';try{sessionStorage.setItem('mch_secret','1')}catch(e){}window.__studioStart&&window.__studioStart()}
  function paint(){dots.forEach(function(d,i){d.classList.toggle('on',i<val.length)})}
  function press(k){
    if(k==='<'){val=val.slice(0,-1);paint();return}
    if(val.length>=4)return;val+=k;paint();
    if(val.length===4){
      if(val===CODE)setTimeout(open,150);
      else{var D=document.getElementById('dots');D.classList.add('bad');setTimeout(function(){D.classList.remove('bad');val='';paint()},450)}
    }
  }
  '123456789 0<'.split('').forEach(function(k){var b=document.createElement('button');if(k===' '){b.style.visibility='hidden'}else{b.textContent=k==='<'?'DEL':k;b.addEventListener('click',function(){press(k)})}pad.appendChild(b)});
  document.addEventListener('keydown',function(e){if(!document.body.classList.contains('locked'))return;if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('<')});
  if(unlocked())open();
})();
</script>
<script>
(function(){
var W=1280,H=720;
var PAL=[{n:'Classic',bg:'#0a0a0a',fg:'#ffffff',acc:'#ffffff'},{n:'Paper',bg:'#f2f1ec',fg:'#0a0a0a',acc:'#0a0a0a'},{n:'Ruby',bg:'#0a0a0a',fg:'#ffffff',acc:'#ff2d3d'},{n:'Gold',bg:'#100d05',fg:'#f6e7b4',acc:'#d9a521'},{n:'Flame',bg:'#160800',fg:'#ffffff',acc:'#ff6a1a'},{n:'Mint',bg:'#04120d',fg:'#e8fff6',acc:'#19d38a'},{n:'Ocean',bg:'#050d1c',fg:'#eaf2ff',acc:'#2d7bff'},{n:'Rose',bg:'#160610',fg:'#fff0f6',acc:'#ff3d8b'}];
var cl=function(x,a,b){a=a==null?0:a;b=b==null?1:b;return Math.max(a,Math.min(b,x))};
var seg=function(t,a,b){return cl((t-a)/(b-a))};
var eo=function(t){return 1-Math.pow(1-t,3)},eio=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
var eb=function(t){var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
var FS=function(s,w){return (w||800)+' '+s+'px Inter,Helvetica,Arial,sans-serif'};
var SERIF=function(s){return '400 '+s+'px "Instrument Serif",Georgia,serif'};
var MONO=function(s){return '700 '+s+'px "Courier New",monospace'};
function rnd(seed){var s=(seed|0)||1;return function(){s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000}}
function fit(c,txt,maxW,size,fn){fn=fn||FS;c.font=fn(size);var w=c.measureText(txt).width;return w>maxW?Math.max(10,Math.floor(size*maxW/w)):size}
function bg(c,o){c.fillStyle=o.pal.bg;c.fillRect(0,0,W,H)}
function hat(c,cx,cy,s,fill,cut){
  c.fillStyle=fill;[[-.3,-.42,.3],[0,-.56,.36],[.3,-.42,.3]].forEach(function(p){c.beginPath();c.arc(cx+p[0]*s,cy+p[1]*s,p[2]*s,0,7);c.fill()});
  c.fillRect(cx-.42*s,cy-.32*s,.84*s,.52*s);c.fillRect(cx-.42*s,cy+.25*s,.84*s,.2*s);
  c.fillStyle=cut;c.fillRect(cx-.15*s,cy-.2*s,.045*s,.3*s);c.fillRect(cx+.11*s,cy-.2*s,.045*s,.3*s);c.fillRect(cx-.42*s,cy+.2*s,.84*s,.05*s);
}
function grid(c,t,o,a){c.save();c.strokeStyle=o.pal.fg;c.globalAlpha=a;c.lineWidth=1;var g=64,off=(t*14)%g;c.beginPath();for(var x=-off;x<W;x+=g){c.moveTo(x,0);c.lineTo(x,H)}for(var y=0;y<H;y+=g){c.moveTo(0,y);c.lineTo(W,y)}c.stroke();c.restore()}
function center(c,txt,size,y,font,col){c.font=(font||FS)(size);c.textAlign='center';c.textBaseline='middle';c.fillStyle=col;c.fillText(txt,W/2,y)}
function subline(c,o,y,a){if(!o.sub)return;c.save();c.globalAlpha*=a;center(c,o.sub.toUpperCase(),Math.min(34,fit(c,o.sub.toUpperCase(),1100,34,function(s){return FS(s,600)})),y,function(s){return FS(s,600)},o.pal.fg);c.restore()}
function bigLines(c,o,y,size){var L=o.lines;var s=size;L.forEach(function(l){s=Math.min(s,fit(c,l,1120,size))});return {L:L,s:s,lh:s*1.08,y0:y-(L.length-1)*s*1.08/2}}
function btn(c,x,y,w,h,txt,fill,tc,size){c.fillStyle=fill;c.fillRect(x,y,w,h);c.fillStyle=tc;c.font=FS(size||30);c.textAlign='center';c.textBaseline='middle';c.fillText(txt,x+w/2,y+h/2+2)}
function bell(c,x,y,s,col,rot){c.save();c.translate(x,y);c.rotate(rot||0);c.fillStyle=col;c.beginPath();c.moveTo(-s,s*.5);c.quadraticCurveTo(-s,-s*.9,0,-s*.95);c.quadraticCurveTo(s,-s*.9,s,s*.5);c.lineTo(s*1.2,s*.7);c.lineTo(-s*1.2,s*.7);c.closePath();c.fill();c.beginPath();c.arc(0,s*.95,s*.28,0,7);c.fill();c.restore()}
function cursor(c,x,y,s,fill,st){c.save();c.translate(x,y);c.scale(s,s);c.beginPath();c.moveTo(0,0);c.lineTo(0,26);c.lineTo(7,20);c.lineTo(12,31);c.lineTo(17,29);c.lineTo(12,19);c.lineTo(21,19);c.closePath();c.fillStyle=fill;c.fill();c.lineWidth=2;c.strokeStyle=st;c.stroke();c.restore()}

/* ===== the 25 animation templates (x4 looks each = 100 clips) ===== */
var T=[];
function add(id,name,cat,over,dur,text,sub,names,sfx,thumb,draw){T.push({id:id,name:name,cat:cat,over:over,dur:dur,text:text,sub:sub,names:names,sfx:sfx,thumb:thumb,draw:draw})}
var WEL='WELCOME TO|MASTERCHEFHUB';

add('drop','Letter Drop','Intros',0,4,'MASTERCHEFHUB','welcome to the kitchen',['From top','From bottom','From left','Pop'],'hit',1.9,function(c,t,o){
  bg(c,o);grid(c,t,o,.06);var txt=o.text,s=fit(c,txt,1120,120);c.font=FS(s);c.textBaseline='middle';c.textAlign='left';
  var w=c.measureText(txt).width,x=(W-w)/2,y=H/2-20,n=txt.length;
  for(var i=0;i<n;i++){var ch=txt[i],cw=c.measureText(ch).width,d=seg(t,i*.045,i*.045+.7),e=eb(d),dx=0,dy=0,sc=1;
    if(o.v==0)dy=-(1-e)*520;else if(o.v==1)dy=(1-e)*520;else if(o.v==2)dx=-(1-e)*900;else sc=e;
    c.save();c.globalAlpha=cl(d*4);c.translate(x+cw/2+dx,y+dy);c.scale(sc,sc);c.fillStyle=o.pal.fg;c.textAlign='center';c.font=FS(s);c.fillText(ch,0,0);c.restore();x+=cw}
  var ub=seg(t,n*.045,n*.045+.5);c.fillStyle=o.pal.acc;c.fillRect((W-w)/2,y+s*.62,w*eo(ub),6);subline(c,o,y+s*.62+56,seg(t,n*.045+.2,n*.045+.7))});

add('bars','Bar Reveal','Intros',0,4,WEL,'the home food kitchen',['Rows left','Columns down','Rows right','Columns up'],'whoosh',2.2,function(c,t,o){
  bg(c,o);var B=bigLines(c,o,H/2-10,130);c.textBaseline='middle';c.textAlign='center';c.fillStyle=o.pal.fg;
  B.L.forEach(function(l,i){c.font=FS(B.s);c.fillText(l,W/2,B.y0+i*B.lh)});subline(c,o,B.y0+B.L.length*B.lh*.62+40,seg(t,1.3,1.8));
  var N=8,vert=o.v%2==1;c.fillStyle=o.pal.acc;
  for(var i=0;i<N;i++){var d=eio(seg(t,.2+i*.07,.2+i*.07+.6));
    if(!vert){var h=H/N,w=W*(1-d);c.fillRect(o.v==2?W-w:0,i*h,w,h+1)}else{var ww=W/N,hh=H*(1-d);c.fillRect(i*ww,o.v==3?H-hh:0,ww+1,hh)}}});

add('zoom','Zoom Through','Intros',0,4,WEL,'chef made. delivered.',['Straight','Spin','Ghost trail','Slam'],'hit',2,function(c,t,o){
  bg(c,o);var B=bigLines(c,o,H/2-10,140),p=eo(seg(t,.1,1)),ghosts=o.v==2?7:3;c.textBaseline='middle';c.textAlign='center';
  for(var g=ghosts;g>=0;g--){var sc=1+(g*.22+ (o.v==3?3:5)*(1-p))*(g==0?1:1),a=g==0?cl(p*2):.16*(1-p);c.save();c.globalAlpha*=a;c.translate(W/2,H/2);c.rotate(o.v==1?(1-p)*-.5:0);c.scale(sc,sc);c.translate(-W/2,-H/2);
    c.fillStyle=g==0?o.pal.fg:o.pal.acc;B.L.forEach(function(l,i){c.font=FS(B.s);c.fillText(l,W/2,B.y0+i*B.lh)});c.restore()}
  var sh=o.v==3&&t>.9&&t<1.3?(Math.random()-.5)*12*(1.3-t)*3:0;c.fillStyle=o.pal.acc;c.fillRect(W/2-300*eo(seg(t,.9,1.5))+sh,B.y0+B.L.length*B.lh*.6+20,600*eo(seg(t,.9,1.5)),6);subline(c,o,B.y0+B.L.length*B.lh*.6+70,seg(t,1.3,1.9))});

add('glitch','Glitch Title','Intros',0,4,WEL,'fresh food. chef made.',['RGB split','Heavy','Slow burn','Flicker'],'zap',2.4,function(c,t,o){
  bg(c,o);var B=bigLines(c,o,H/2,128);c.textBaseline='middle';c.textAlign='center';
  var on=o.v==2?((t*.9)%1)<.2:(t<1.1||((t*1.3)%1)<.07||(o.v==3&&((t*7)%1)<.08)),amt=o.v==1?110:50,fr=Math.floor(t*24);
  var al=o.v==2?seg(t,0,1):cl(t*6);
  for(var j=0;j<8;j++){var r=rnd(fr*13+j*7)(),dx=on?(r-.5)*amt:0;c.save();c.beginPath();c.rect(0,j*H/8,W,H/8+1);c.clip();c.globalAlpha*=al;
    if(on){c.fillStyle=o.pal.acc;B.L.forEach(function(l,i){c.font=FS(B.s);c.fillText(l,W/2+dx+10,B.y0+i*B.lh)})}
    c.fillStyle=o.pal.fg;B.L.forEach(function(l,i){c.font=FS(B.s);c.fillText(l,W/2+dx,B.y0+i*B.lh)});c.restore()}
  subline(c,o,B.y0+B.L.length*B.lh*.62+40,seg(t,1.2,1.7))});

add('neon','Neon Draw','Intros',0,5,WEL,'now cooking',['Cyan-free glow','Thin','Heavy','Flicker'],'zap',3,function(c,t,o){
  bg(c,o);var B=bigLines(c,o,H/2-10,130),p=seg(t,.1,1.8),fl=o.v==3?(Math.sin(t*40)>.6&&t>2?.5:1):1;c.textBaseline='middle';c.textAlign='center';c.lineJoin='round';
  c.lineWidth=o.v==1?2:o.v==2?6:3.5;c.strokeStyle=o.pal.acc;c.shadowColor=o.pal.acc;c.shadowBlur=24*fl;c.setLineDash([3200,3200]);c.lineDashOffset=3200*(1-eo(p));
  B.L.forEach(function(l,i){c.font=FS(B.s);c.strokeText(l,W/2,B.y0+i*B.lh)});c.setLineDash([]);
  c.save();c.globalAlpha*=seg(t,1.6,2.4)*fl;c.fillStyle=o.pal.fg;B.L.forEach(function(l,i){c.font=FS(B.s);c.fillText(l,W/2,B.y0+i*B.lh)});c.restore();c.shadowBlur=0;subline(c,o,B.y0+B.L.length*B.lh*.62+44,seg(t,2.2,2.8))});

function insp(){
  var it=S.items.find(function(i){return i.id===S.sel}),b=$('#insp');
  if(!it){b.innerHTML='<h3>EDIT</h3><p class="hint">Tap a clip in the timeline to edit its text, colors, length and timing. Tap the empty timeline to move the red playhead. Drag a clip to move it, drag its right edge to make it longer.</p>';return}
  if(it.kind==='snd'){var s=SBY[it.ref];b.innerHTML='<h3>SOUND - '+esc(s.name.toUpperCase())+'</h3><div class="g2"><div class="fl"><label>Start (sec)</label><input id="iS" type="number" step="0.1" min="0" value="'+it.start.toFixed(2)+'"></div><div class="fl"><label>Volume</label><input id="iV" type="range" min="0" max="1.5" step="0.05" value="'+(it.vol==null?1:it.vol)+'"></div></div><div class="g2"><button class="b s" id="iPrev">Preview</button><button class="b s" id="iDup">Duplicate</button></div><div style="height:8px"></div><button class="b s" id="iDel" style="width:100%">Delete</button>';return}
  var c=CBY[it.ref];
  b.innerHTML='<h3>CLIP - '+esc(c.name.toUpperCase())+'</h3>'+
  (c.text!==''||c.tpl.text!==''?'<div class="fl"><label>Text (use | for a new line)</label><input id="iT" value="'+esc(it.text)+'"></div>':'')+
  (c.sub!==''||c.tpl.sub!==''?'<div class="fl"><label>Small text</label><input id="iU" value="'+esc(it.sub)+'"></div>':'')+
  '<div class="g2"><div class="fl"><label>Start (sec)</label><input id="iS" type="number" step="0.1" min="0" value="'+it.start.toFixed(2)+'"></div><div class="fl"><label>Length (sec)</label><input id="iD" type="number" step="0.1" min="0.3" value="'+it.dur.toFixed(2)+'"></div></div>'+
  '<div class="g2"><div class="fl"><label>Colors</label><select id="iP">'+PAL.map(function(p,i){return'<option value="'+i+'"'+((it.pal==null?c.pal:it.pal)==i?' selected':'')+'>'+p.n+'</option>'}).join('')+'</select></div><div class="fl"><label>Fade in / out</label><select id="iF">'+[[0,'None'],[.3,'Short'],[.6,'Medium'],[1,'Long']].map(function(f){return'<option value="'+f[0]+'"'+(it.fade==f[0]?' selected':'')+'>'+f[1]+'</option>'}).join('')+'</select></div></div>'+
  '<div class="g2"><button class="b s" id="iSplit">Split at playhead</button><button class="b s" id="iDup">Duplicate</button></div><div style="height:8px"></div><button class="b s" id="iDel" style="width:100%">Delete</button>';
}
$('#insp').addEventListener('input',function(e){
  var it=S.items.find(function(i){return i.id===S.sel});if(!it)return;var id=e.target.id;
  if(id==='iT')it.text=e.target.value;else if(id==='iU')it.sub=e.target.value;else if(id==='iS')it.start=Math.max(0,+e.target.value||0);else if(id==='iD')it.dur=Math.max(.3,+e.target.value||1);else if(id==='iP')it.pal=+e.target.value;else if(id==='iF')it.fade=+e.target.value;else if(id==='iV')it.vol=+e.target.value;
  drawTL();render();ui();save();
});
$('#insp').addEventListener('click',function(e){
  var it=S.items.find(function(i){return i.id===S.sel});if(!it)return;var id=e.target.id;
  if(id==='iDel'){S.items=S.items.filter(function(i){return i!==it});S.sel=null;drawTL();insp();render();ui();save()}
  else if(id==='iDup'){var d=JSON.parse(JSON.stringify(it));d.id=S.next++;d.start=it.start+it.dur;S.items.push(d);S.sel=d.id;drawTL();insp();render();ui();save()}
  else if(id==='iPrev'){hearSound(it.ref,it.vol)}
  else if(id==='iSplit'){var at=S.t;if(at>it.start+.2&&at<it.start+it.dur-.2){var d2=JSON.parse(JSON.stringify(it));d2.id=S.next++;d2.start=at;d2.off=(it.off||0)+(at-it.start);d2.dur=it.start+it.dur-at;it.dur=at-it.start;S.items.push(d2);S.sel=d2.id;drawTL();insp();render();save()}}
});

/* ===== playback ===== */
var raf=0,t0=0;
function stopSounds(){if(MASTER){try{MASTER.gain.cancelScheduledValues(0);MASTER.gain.setValueAtTime(0,ACX.currentTime);var m=MASTER;setTimeout(function(){try{m.disconnect()}catch(e){}},50)}catch(e){}MASTER=null}}
function play(){
  if(!total())return;var x=audio();if(S.t>=total()-.05)S.t=0;S.playing=true;t0=performance.now()-S.t*1000;
  if(x){MASTER=x.createGain();MASTER.gain.value=1;MASTER.connect(x.destination);MASTER.connect(DEST);var base=x.currentTime+.05;
    S.items.forEach(function(it){if(it.kind==='snd'&&it.start>=S.t-.01)try{SBY[it.ref].play(x,MASTER,base+(it.start-S.t),it.vol==null?1:it.vol)}catch(e){}})}
  cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);ui();
}
function pause(){S.playing=false;cancelAnimationFrame(raf);stopSounds();ui()}
function tick(){
  if(!S.playing)return;S.t=(performance.now()-t0)/1000;var tot=total();
  if(S.t>=tot+(S.exporting?.4:0)){S.t=tot;pause();render();ui();if(S.exporting)finishExport();return}
  render();ui();autoscroll();raf=requestAnimationFrame(tick);
}
function hearSound(id,vol){var x=audio();if(!x)return;var g=x.createGain();g.connect(x.destination);try{SBY[id].play(x,g,x.currentTime+.03,vol==null?1:vol)}catch(e){}}

/* ===== adding things ===== */
function addClip(id){
  var c=CBY[id],it={id:S.next++,kind:'clip',ref:id,track:c.over?1:0,start:0,dur:c.dur,off:0,text:c.text,sub:c.sub,pal:c.pal,fade:0,vol:1};
  if(c.over)it.start=Math.round(S.t*10)/10;else{var e=0;S.items.forEach(function(i){if(i.track===0)e=Math.max(e,i.start+i.dur)});it.start=e}
  S.items.push(it);S.sel=it.id;
  if(S.sfx&&c.sfx&&SBY[c.sfx]){var s=SBY[c.sfx];addSnd(c.sfx,Math.max(0,it.start-(c.over?0:0)),true)}
  S.t=it.start+Math.min(c.tpl.thumb,it.dur*.9);drawTL();insp();render();ui();save();
  var sc=$('#tls'),x=pxs(it.start);sc.scrollLeft=Math.max(0,x-40);
}
function addSnd(id,start,quiet){
  var s=SBY[id],row=2;if(start==null)start=Math.round(S.t*10)/10;
  var busy=S.items.some(function(i){return i.track===2&&i.kind==='snd'&&start<i.start+i.dur&&start+s.dur>i.start});if(busy)row=3;
  var it={id:S.next++,kind:'snd',ref:id,track:row,start:start,dur:s.dur,off:0,vol:1};S.items.push(it);
  if(!quiet){S.sel=it.id;drawTL();insp();render();ui();save()}
}

/* ===== library ===== */
var CATS=['All','Intros','Overlays','Backgrounds','Transitions','Outros'];
function lib(){
  var h='';
  if(S.tab==='clips'){
    h+='<div class="chips">'+CATS.map(function(c){return'<button data-cat="'+c+'" class="'+(S.cat===c?'on':'')+'">'+c.toUpperCase()+'</button>'}).join('')+'</div>';
    h+='<input id="q" placeholder="Search clips" value="'+esc(S.q)+'" style="margin-bottom:8px"><label class="hint" style="display:flex;gap:8px;align-items:center;margin:6px 0 10px"><input type="checkbox" id="sfxc" style="width:auto"'+(S.sfx?' checked':'')+'> Add a matching sound when I add a clip</label>';
    h+='<div class="grid" id="cg"></div>';
  }else{
    h+='<p class="hint" style="margin-bottom:10px">'+SND.length+' free sounds and beats made right here. Tap play to hear one, tap Add to drop it on the timeline at the red playhead.</p><div id="sg"></div>';
  }
  $('#lib').innerHTML=h;
  if(S.tab==='clips')clipGrid();else $('#sg').innerHTML=SND.map(function(s){return'<div class="sn"><button class="b s" data-hear="'+s.id+'">Play</button><div>'+esc(s.name)+'<small>'+s.dur.toFixed(1)+' SEC - FREE</small></div><button class="b s f" data-sadd="'+s.id+'">Add</button></div>'}).join('');
}
function clipGrid(){
  var q=S.q.toLowerCase(),list=CLIPS.filter(function(c){return(S.cat==='All'||c.cat===S.cat)&&(!q||c.name.toLowerCase().indexOf(q)>=0)});
  var g=$('#cg');g.innerHTML=list.map(function(c){return'<button class="cd" data-add="'+c.id+'"><canvas width="320" height="180" data-th="'+c.id+'"></canvas><div class="n">'+esc(c.name)+'</div><div class="m"><span>'+c.cat.toUpperCase()+' - '+c.dur+'S</span><b>FREE</b></div></button>'}).join('')||'<p class="hint">No clips match.</p>';
  g.querySelectorAll('canvas').forEach(function(cvs){var c=CBY[cvs.dataset.th];drawThumb(cvs,c,c.thumb)});
}
var hov=null;
$('#lib').addEventListener('mouseover',function(e){var cvs=e.target.closest('.cd');if(!cvs||hov&&hov.el===cvs)return;stopHov();var c=CBY[cvs.dataset.add],cn=cvs.querySelector('canvas'),st=performance.now();hov={el:cvs,raf:0,c:c,cn:cn};(function f(){if(!hov||hov.el!==cvs)return;var t=((performance.now()-st)/1000)%c.dur;drawThumb(cn,c,t);hov.raf=requestAnimationFrame(f)})()});
$('#lib').addEventListener('mouseout',function(e){var cvs=e.target.closest('.cd');if(cvs&&hov&&hov.el===cvs&&!cvs.contains(e.relatedTarget))stopHov()});
function stopHov(){if(hov){cancelAnimationFrame(hov.raf);drawThumb(hov.cn,hov.c,hov.c.thumb);hov=null}}
$('#lib').addEventListener('click',function(e){
  var a=e.target.closest('[data-add]');if(a){addClip(a.dataset.add);return}
  var ct=e.target.closest('[data-cat]');if(ct){S.cat=ct.dataset.cat;lib();return}
  var hs=e.target.closest('[data-hear]');if(hs){hearSound(hs.dataset.hear);return}
  var sa=e.target.closest('[data-sadd]');if(sa){addSnd(sa.dataset.sadd);return}
  if(e.target.id==='sfxc')S.sfx=e.target.checked;
});
$('#lib').addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;clipGrid()}});
$('#tC').addEventListener('click',function(){S.tab='clips';$('#tC').classList.add('on');$('#tS').classList.remove('on');lib()});
$('#tS').addEventListener('click',function(){S.tab='snd';$('#tS').classList.add('on');$('#tC').classList.remove('on');lib()});

/* ===== buttons ===== */
$('#bPlay').addEventListener('click',function(){S.playing?pause():play()});
$('#bStop').addEventListener('click',function(){pause();S.t=0;render();ui();$('#tls').scrollLeft=0});
$('#zoom').addEventListener('input',function(e){S.pps=+e.target.value;drawTL()});
$('#bNew').addEventListener('click',function(){if(S.items.length&&!confirm('Start a new empty project?'))return;pause();S.items=[];S.sel=null;S.t=0;drawTL();insp();render();ui();save()});
$('#bSave').addEventListener('click',function(){var b=new Blob([JSON.stringify({v:1,items:S.items,next:S.next})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='masterchefhub-project.json';document.body.appendChild(a);a.click();a.remove()});
$('#bLoad').addEventListener('click',function(){$('#fLoad').click()});
$('#fLoad').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);S.items=d.items.filter(function(i){return i.kind==='snd'?SBY[i.ref]:CBY[i.ref]});S.next=d.next||S.items.length+1;S.sel=null;S.t=0;drawTL();insp();render();ui();save()}catch(x){alert('That file is not a MasterChefHub project.')}};r.readAsText(f);e.target.value=''});
document.addEventListener('keydown',function(e){
  if(document.body.classList.contains('locked'))return;var tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();S.playing?pause():play()}
  else if((e.key==='Delete'||e.key==='Backspace')&&S.sel){var b=$('#iDel');if(b)b.click()}
  else if(e.key==='ArrowLeft'){S.t=Math.max(0,S.t-.1);render();ui()}else if(e.key==='ArrowRight'){S.t+=.1;render();ui()}
});

/* ===== export a real video file ===== */
var rec=null,chunks=[],mime='';
function pickMime(){var l=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4;codecs=avc1,mp4a.40.2','video/mp4'];for(var i=0;i<l.length;i++){try{if(window.MediaRecorder&&MediaRecorder.isTypeSupported(l[i]))return l[i]}catch(e){}}return''}
function ov(html){$('#ovb').innerHTML=html;$('#ov').classList.add('on')}
function closeOv(){$('#ov').classList.remove('on')}
$('#bExp').addEventListener('click',function(){
  if(!total()){ov('<h3 style="letter-spacing:.2em;font-size:.8rem;margin-bottom:10px">NOTHING TO EXPORT</h3><p class="hint">Add a clip first.</p><div style="height:14px"></div><button class="b f" id="ovx">OK</button>');return}
  mime=pickMime();if(!mime||!cv.captureStream){ov('<h3 style="letter-spacing:.2em;font-size:.8rem;margin-bottom:10px">CANNOT RECORD HERE</h3><p class="hint">This browser cannot save video. Open this page in Chrome or Edge on a computer, or Safari on a recent iPhone.</p><div style="height:14px"></div><button class="b f" id="ovx">OK</button>');return}
  pause();var res=+$('#res').value;cv.width=res===1080?1920:1280;cv.height=res===1080?1080:720;
  var x=audio();S.t=0;render();chunks=[];
  var st=cv.captureStream(30);if(x&&DEST){var at=DEST.stream.getAudioTracks()[0];if(at)st.addTrack(at)}
  try{rec=new MediaRecorder(st,{mimeType:mime,videoBitsPerSecond:res===1080?9e6:5e6})}catch(e){rec=new MediaRecorder(st)}
  rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=function(){var type=(mime.split(';')[0])||'video/webm',blob=new Blob(chunks,{type:type}),url=URL.createObjectURL(blob),ext=/mp4/.test(type)?'mp4':'webm';
    cv.width=1280;cv.height=720;S.exporting=false;S.t=0;render();ui();
    ov('<h3 style="letter-spacing:.2em;font-size:.8rem;margin-bottom:10px">YOUR VIDEO IS READY</h3><video src="'+url+'" controls playsinline style="width:100%;background:#000;margin-bottom:12px"></video><a class="b f" style="display:block;text-decoration:none" href="'+url+'" download="masterchefhub-video.'+ext+'">DOWNLOAD VIDEO (.'+ext.toUpperCase()+')</a><div style="height:10px"></div><button class="b" id="ovx">CLOSE</button>')};
  S.exporting=true;ov('<h3 style="letter-spacing:.2em;font-size:.8rem;margin-bottom:10px">RECORDING YOUR VIDEO</h3><p class="hint">It records in real time, so it takes as long as your video ('+fmt(total())+'). Keep this page open and on screen.</p><div class="bar"><i id="xb"></i></div><button class="b" id="ovc">CANCEL</button>');
  rec.start(250);play();
  var iv=setInterval(function(){var b=$('#xb');if(b)b.style.width=Math.min(100,S.t/total()*100)+'%';if(!S.exporting)clearInterval(iv)},200);
});
function finishExport(){setTimeout(function(){try{rec.stop()}catch(e){}},200)}
$('#ov').addEventListener('click',function(e){
  if(e.target.id==='ovx')closeOv();
  if(e.target.id==='ovc'){S.exporting=false;try{rec.onstop=null;rec.stop()}catch(x){}pause();cv.width=1280;cv.height=720;closeOv();render()}
});

/* ===== start ===== */
window.__studioStart=function(){
  if(window.__started)return;window.__started=true;
  $('#cnt').textContent=CLIPS.length+' FREE CLIPS - '+SND.length+' FREE SOUNDS';
  load();lib();drawTL();insp();render();ui();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){lib();render()});
};
if(!document.body.classList.contains('locked'))window.__studioStart();
window.__S=S;window.__addClip=addClip;
})();
</script>
