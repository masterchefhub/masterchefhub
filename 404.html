<style>
:root{--bg:#0a0a0a;--ink:#fff;--muted:#8f8f8f;--line:#262626;--accent:#ff5a1f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;display:flex;flex-direction:column;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.serif{font-family:'Instrument Serif',serif;font-weight:400;letter-spacing:-.02em}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* background rings */
.rings{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.rings i{position:absolute;left:50%;top:50%;border:1px solid var(--line);border-radius:50%;transform:translate(-50%,-50%);animation:breathe 7s ease-in-out infinite}
.rings i:nth-child(1){width:380px;height:380px}
.rings i:nth-child(2){width:640px;height:640px;animation-delay:-1.4s}
.rings i:nth-child(3){width:900px;height:900px;animation-delay:-2.8s}
.rings i:nth-child(4){width:1180px;height:1180px;animation-delay:-4.2s}
@keyframes breathe{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}

/* header */
header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:26px 40px}
.logo{display:flex;align-items:center;gap:12px}
.logo-mark{width:44px;height:44px;border-radius:14px;background:#fff;color:#0a0a0a;display:grid;place-items:center;transition:.4s}
.logo-mark .ico{width:26px;height:26px;stroke-width:1.7}
.logo:hover .logo-mark{transform:rotate(-8deg) scale(1.08)}
.logo:hover .hat{animation:hat .7s ease}
@keyframes hat{0%,100%{transform:translateY(0)}30%{transform:translateY(-4px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.logo-text{font-weight:800;font-size:1.55rem;letter-spacing:.03em;line-height:1}
.logo-text small{display:block;font-weight:600;font-size:.56rem;letter-spacing:.2em;color:#8a8a8a;text-transform:uppercase;margin-top:4px;white-space:nowrap}
.sound-btn{display:flex;align-items:center;gap:10px;background:#151515;border:1px solid #262626;color:#cfcfcf;padding:10px 16px;border-radius:99px;cursor:pointer;font-weight:500;font-size:.85rem;transition:.25s}
.sound-btn:hover{background:#1f1f1f;color:#fff}
.eq{display:flex;align-items:flex-end;gap:2px;height:14px}
.eq i{width:3px;background:#fff;border-radius:2px;height:4px}
.sound-on .eq i{animation:eq .9s ease-in-out infinite}
.sound-on .eq i:nth-child(2){animation-delay:-.3s}
.sound-on .eq i:nth-child(3){animation-delay:-.6s}
.sound-on .eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.sound-btn .off{display:none}
.muted .sound-btn .on{display:none}
.muted .sound-btn .off{display:block}

/* main */
main{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 24px 50px}
.pill{display:inline-flex;align-items:center;gap:10px;border:1px solid #333;padding:7px 16px;border-radius:99px;font-size:.8rem;font-weight:600;color:#d4d4d4;margin-bottom:10px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,31,.7)}100%{box-shadow:0 0 0 12px rgba(255,90,31,0)}}
.big404{display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,22px);font-family:'Instrument Serif',serif;font-size:clamp(7rem,24vw,17rem);line-height:1;letter-spacing:-.04em;user-select:none}
.big404 span.n{display:inline-block;animation:drop 1s cubic-bezier(.2,.9,.3,1.3) both}
.big404 span.n:last-child{animation-delay:.15s}
@keyframes drop{from{opacity:0;transform:translateY(-60px) rotate(-6deg)}to{opacity:1;transform:none}}
.plate{position:relative;width:.72em;height:.72em;border-radius:50%;background:#fff;color:#0a0a0a;display:grid;place-items:center;animation:wobble 4s ease-in-out infinite;cursor:pointer;flex-shrink:0;transition:transform .3s}
.plate:hover{animation-play-state:paused;transform:scale(1.08) rotate(14deg)}
.plate .ico{width:56%;height:56%;stroke-width:1.3}
.plate::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px dashed #3a3a3a;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wobble{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-12px)}}
h1{font-size:clamp(2.4rem,6vw,4.6rem);line-height:1.02;margin:22px 0 16px;animation:fade .8s .3s both}
h1 em{font-style:italic;color:#b5b5b5}
p.sub{color:var(--muted);font-size:1.08rem;max-width:480px;margin:0 auto 34px;animation:fade .8s .45s both}
@keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;animation:fade .8s .6s both}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 30px;border-radius:99px;font-weight:700;font-size:.98rem;border:1.5px solid transparent;cursor:pointer;transition:.25s}
.btn .ico{transition:transform .3s}
.btn-white{background:#fff;color:#0a0a0a}
.btn-white:hover{background:#e9e9e9;transform:translateY(-3px);box-shadow:0 14px 34px rgba(255,255,255,.12)}
.btn-white:hover .ico{animation:hat .6s ease}
.btn-line{border-color:#3a3a3a;color:#fff;background:transparent}
.btn-line:hover{background:#fff;color:#0a0a0a;border-color:#fff;transform:translateY(-3px)}
.btn:hover .arrow{transform:translateX(5px)}
.quick{margin-top:38px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;color:var(--muted);font-size:.88rem;align-items:center;animation:fade .8s .75s both}
.quick a{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid #2a2a2a;border-radius:99px;font-weight:600;color:#d4d4d4;transition:.25s}
.quick a:hover{background:#fff;color:#0a0a0a;border-color:#fff}
.quick a:hover .ico{animation:wiggle .6s ease}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.1)}60%{transform:rotate(10deg) scale(1.1)}}
.quick .ico{width:16px;height:16px}
footer{position:relative;z-index:2;text-align:center;color:#5c5c5c;font-size:.82rem;padding:0 20px 26px}

@media(max-width:600px){
  header{padding:20px}
  .sound-btn span.lbl{display:none}
  .rings i:nth-child(4){display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>window.sfx=window.sfx||{hover(){},click(){},on(){},off(){},open(){},heart(){},success(){},whoops(){},boing(){}};</script>
<script>
/* Browsers only allow sound after a first interaction: play the whoops once then */
let played=false;
function firstSound(){ if(played) return; played=true; sfx.whoops(); }
['pointerdown','keydown','touchstart'].forEach(ev=>window.addEventListener(ev,firstSound,{once:true}));

/* click the plate for a fun boing */
document.getElementById('plate').addEventListener('click',e=>{
  e.stopPropagation(); sfx.boing();
  const p=e.currentTarget;
  p.animate([{transform:'scale(1) rotate(0)'},{transform:'scale(1.25) rotate(180deg)'},{transform:'scale(1) rotate(360deg)'}],{duration:700,easing:'cubic-bezier(.2,.9,.3,1.3)'});
});
</script>
